# The full stack — the system of record behind the demo snapshot.
#
#   docker compose up -d --build            # Qdrant + Neo4j + API (ingest enabled) on :8000
#
# Rebuild the corpus and the demo snapshot from your machine (see README
# "Build the corpus"): with qdrant + neo4j up, run
#   STORE_PROFILE=full REQUIRE_BYOK=false GOOGLE_API_KEY=... python etl.py ingest
#   STORE_PROFILE=full python etl.py export
#
# Neo4j Browser: http://localhost:7474 (neo4j / papergraph)
# Qdrant dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/papergraph
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p papergraph 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      args:
        WITH_ETL: "true"
    environment:
      STORE_PROFILE: full
      ENABLE_INGEST: "true"
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: papergraph
    ports: ["8000:8080"]
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

volumes:
  qdrant_data:
  neo4j_data:
