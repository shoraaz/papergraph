name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Qdrant + Neo4j on every push: the same contract suite runs against
    # them and against the embedded/snapshot stores the demo serves, so the
    # two storage profiles can't drift apart unnoticed.
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/papergraph
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p papergraph 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      EMBEDDER: hashing
      REQUIRE_DB_TESTS: "1"
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: papergraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t papergraph:ci .
      - name: container boots and reports healthy
        run: |
          docker run -d --name pg -p 8080:8080 papergraph:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && exit 0; sleep 1; done
          docker logs pg; exit 1
