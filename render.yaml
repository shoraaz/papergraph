# Optional: Render deploys the same container. Note Render's free plan
# still sleeps after ~15 idle minutes; the frontend's static corpus and
# recorded replays keep the page useful while it wakes. Vercel (see
# vercel.json) or Cloud Run give faster cold starts.
services:
  - type: web
    name: papergraph
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STORE_PROFILE
        value: demo
