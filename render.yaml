services:
  - type: web
    name: papergraph
    env: python
    buildCommand: "uv sync"
    startCommand: "sh -c 'uv run uvicorn server:app --host 0.0.0.0 --port ${PORT:-10000}'"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENABLE_RERANKER
        value: "false"
