[project]
name = "papergraph"
version = "2.0.0"
description = "Agentic research paper copilot: GraphRAG prerequisite sequencing, Self-RAG grounding checks, Corrective RAG claim verification over Qdrant + Neo4j."
readme = "README.md"
requires-python = ">=3.11"
# Runtime only — mirrors requirements.txt (the serving bundle).
dependencies = [
    "agno==2.8.2",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7,<1",
    "neo4j>=5.28,<7",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "sse-starlette>=3.4.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.2.2",
    "google-genai>=1.0.0",
    "groq>=1.6.0",
    "openai>=2.48.0",
]

[project.optional-dependencies]
etl = ["arxiv>=2.1", "pymupdf>=1.24", "requests>=2.31"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
eval = ["ragas==0.3.9", "langchain-google-genai>=4.3.2", "langchain-community>=0.4.2"]
