    "neo4j>=5.28.0",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
    "google-genai>=1.0.0",
    "mem0ai>=0.1.100",
    "python-dotenv>=1.2.2",
    "fastembed>=0.8.0",
    "arxiv>=4.0.0",
    "pymupdf>=1.28.0",
    "groq>=1.6.0",
    "openai>=2.48.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "sse-starlette>=3.4.6",
    "ragas==0.3.9",
    "langchain-google-genai>=4.3.2",
    "langchain-community>=0.4.2",
]
